<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Kobi's Delivery – Sign for Delivery</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#f4f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:19px;line-height:1.4;-webkit-text-size-adjust:100%}
  main{max-width:560px;margin:0 auto;padding:12px 12px calc(32px + env(safe-area-inset-bottom))}
  .card{background:#fff;border:1px solid #dcdfe4;border-radius:16px;padding:14px 16px;margin-bottom:12px}
  .head{display:flex;align-items:center;gap:14px}
  .head img{width:64px;height:64px;flex:none}
  .head h1{font-size:22px;margin:0}
  .head .sub{font-size:16px;color:#555}
  .test{display:inline-block;background:#d32020;color:#fff;font-weight:800;letter-spacing:1px;border-radius:8px;padding:2px 10px;font-size:16px;margin-left:6px;vertical-align:middle}
  .test[hidden]{display:none !important}
  dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
  dt{color:#555;font-size:16px;padding-top:2px}
  dd{margin:0;font-weight:600;word-break:break-word}
  label{display:block;font-weight:700;margin-bottom:8px}
  input[type=text]{width:100%;font-size:20px;padding:14px;border:2px solid #b9bfc8;border-radius:12px;background:#fff;color:#111}
  input[type=text]:focus{outline:none;border-color:#1a5fd0}
  .padwrap{position:relative;border:2px dashed #8a929e;border-radius:12px;background:#fff;height:220px;touch-action:none}
  canvas#pad{display:block;width:100%;height:100%;touch-action:none;border-radius:12px;cursor:crosshair}
  .hint{position:absolute;left:0;right:0;bottom:44px;text-align:center;color:#9aa1ab;pointer-events:none;font-size:17px}
  .line{position:absolute;left:16px;right:16px;bottom:36px;border-bottom:1px solid #c5cad1;pointer-events:none}
  .row{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
  button{font-size:20px;font-weight:700;border-radius:12px;min-height:56px;padding:0 18px;border:2px solid #1a5fd0;background:#fff;color:#1a5fd0;flex:1 1 120px;-webkit-tap-highlight-color:transparent}
  button.primary{background:#1a5fd0;color:#fff;flex:2 1 180px}
  button:active{opacity:.75}
  .err{color:#b00020;font-weight:700;margin-top:12px;display:none}
  #result{display:none}
  #result img{width:100%;border:1px solid #dcdfe4;border-radius:12px;display:block;-webkit-touch-callout:default}
  .steps{font-size:19px;margin:12px 0 0}
  .ok{color:#0b7a33;font-weight:800;font-size:21px;margin:0 0 10px}
  .small{font-size:15px;color:#666;margin-top:10px}
</style>
</head>

  var wbLabel=info.wb||'(no number)';

  // ---- signature pad ----
  var canvas=document.getElementById('pad'), wrap=document.getElementById('padwrap'), ctx=canvas.getContext('2d');
  var strokes=[], cur=null, dpr=1;
  function resize(){
    dpr=Math.max(1,window.devicePixelRatio||1);
    var r=wrap.getBoundingClientRect();
    var w=Math.round(r.width-4), h=Math.round(r.height-4);
    if(canvas.width===Math.round(w*dpr)&&canvas.height===Math.round(h*dpr)) return;
    canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
    redraw();
  }
  function drawStroke(c,s,scale){
    c.lineCap='round';c.lineJoin='round';c.strokeStyle='#0a1a3a';c.lineWidth=3*scale;
    var pts=s;
    if(pts.length===1){c.beginPath();c.arc(pts[0].x*scale,pts[0].y*scale,1.6*scale,0,Math.PI*2);c.fillStyle='#0a1a3a';c.fill();return;}
    c.beginPath();c.moveTo(pts[0].x*scale,pts[0].y*scale);
    for(var i=1;i<pts.length-1;i++){
      var mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
      c.quadraticCurveTo(pts[i].x*scale,pts[i].y*scale,mx*scale,my*scale);
    }
    var l=pts[pts.length-1];c.lineTo(l.x*scale,l.y*scale);c.stroke();
  }
  function redraw(){
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
    strokes.forEach(function(s){drawStroke(ctx,s,dpr);});
    document.getElementById('hint').style.display=strokes.length?'none':'block';
  }
  function pos(e){var r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  canvas.addEventListener('pointerdown',function(e){
    e.preventDefault();
    try{canvas.setPointerCapture(e.pointerId);}catch(_){}
    cur=[pos(e)];strokes.push(cur);redraw();
  });
  canvas.addEventListener('pointermove',function(e){
    if(!cur) return; e.preventDefault();
    var evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    evs.forEach(function(ev){cur.push(pos(ev));});
    redraw();
  });
  function end(e){ if(cur){cur=null;} }
  canvas.addEventListener('pointerup',end);
  canvas.addEventListener('pointercancel',end);
  // Stop iOS from scrolling/bouncing while finger is on the pad
  ['touchstart','touchmove'].forEach(function(t){wrap.addEventListener(t,function(e){e.preventDefault();},{passive:false});});
  window.addEventListener('resize',resize);
  resize();

  document.getElementById('clear').onclick=function(){strokes=[];redraw();hideErr();};

  var errEl=document.getElementById('err');
  function showErr(m){errEl.textContent=m;errEl.style.display='block';}
  function hideErr(){errEl.style.display='none';}

  function nowText(){
    return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(new Date());
  }
  function bounds(){
    var b={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};
    strokes.forEach(function(s){s.forEach(function(pt){b.x0=Math.min(b.x0,pt.x);b.y0=Math.min(b.y0,pt.y);b.x1=Math.max(b.x1,pt.x);b.y1=Math.max(b.y1,pt.y);});});
    return b;
  }

  var lastFile=null, lastText='', lastTitle='';
  function buildImage(name,time){
    var W=1200,H=760,out=document.createElement('canvas');out.width=W;out.height=H;
    var c=out.getContext('2d');
    c.fillStyle='#fff';c.fillRect(0,0,W,H);
    c.fillStyle='#111';c.font='bold 44px Helvetica, Arial, sans-serif';c.textBaseline='top';
    c.fillText("Kobi's Delivery — Proof of Delivery",40,32);
    c.font='bold 38px Helvetica, Arial, sans-serif';
    c.fillText('Waybill '+wbLabel,40,92);
    if(isTest){c.fillStyle='#d32020';var tx=40+c.measureText('Waybill '+wbLabel).width+20;c.fillRect(tx,90,130,46);c.fillStyle='#fff';c.font='bold 32px Helvetica, Arial, sans-serif';c.fillText('TEST',tx+20,97);}
    c.fillStyle='#444';c.font='28px Helvetica, Arial, sans-serif';
    var line2=[info.customer&&('Customer: '+info.customer),info.pieces,info.weight].filter(Boolean).join('  •  ');
    var line3=[info.from&&('From: '+info.from),info.to&&('To: '+info.to)].filter(Boolean).join('   →   ');
    c.fillText(line2,40,148,W-80);c.fillText(line3,40,186,W-80);
    // signature box
    var bx=40,by=236,bw=W-80,bh=360;
    c.strokeStyle='#c5cad1';c.lineWidth=2;c.strokeRect(bx,by,bw,bh);
    var b=bounds(),sw=b.x1-b.x0||1,sh=b.y1-b.y0||1,pad=30;
    var sc=Math.min((bw-2*pad)/sw,(bh-2*pad)/sh,4);
    c.save();c.translate(bx+(bw-sw*sc)/2-b.x0*sc,by+(bh-sh*sc)/2-b.y0*sc);
    strokes.forEach(function(s){drawStroke(c,s,sc);});
    c.restore();
    c.fillStyle='#111';c.font='bold 34px Helvetica, Arial, sans-serif';
    c.fillText('Received by: '+name,40,616,W-80);
    c.fillStyle='#333';c.font='30px Helvetica, Arial, sans-serif';
    c.fillText('Signed: '+time,40,664,W-80);
    c.fillStyle='#888';c.font='22px Helvetica, Arial, sans-serif';
    c.fillText('kobisdelivery.com',40,710);
    return out;
  }

  document.getElementById('done').onclick=function(){
    if(document.getElementById('result').style.display==='block') return;
    hideErr();
    var name=document.getElementById('name').value.trim();
    var inked=strokes.reduce(function(n,s){return n+s.length;},0);
    if(!name){showErr('Please print the receiver\u2019s name.');document.getElementById('name').focus();return;}
    if(inked<5){showErr('Please sign in the box with your finger.');return;}
    var time=nowText();
    var out=buildImage(name,time);
    var dataUrl=out.toDataURL('image/png');
    document.getElementById('outImg').src=dataUrl;
    lastTitle='Signature '+wbLabel;
    lastText='Signature for waybill '+wbLabel+' \u2014 received by '+name+' at '+time;
    (function(){
      var bin=atob(dataUrl.split(',')[1]),arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
      var blob=new Blob([arr],{type:'image/png'});
      var safe=String(wbLabel).replace(/[^A-Za-z0-9_-]+/g,'_');
      try{lastFile=new File([blob],'Signature-'+safe+'.png',{type:'image/png'});}catch(_){lastFile=null;}
      var instr=document.getElementById('instr'),shareBtn=document.getElementById('share'),note=document.getElementById('note'),status=document.getElementById('status');
      note.textContent=lastText;
      document.getElementById('signCard').style.display='none';
      var r=document.getElementById('result');r.style.display='block';
      r.scrollIntoView({behavior:'smooth',block:'start'});
      function shareFallback(auto,reason){
        status.textContent='\u2713 Signature captured';
        var canShare=!!(lastFile&&navigator.canShare&&navigator.share&&navigator.canShare({files:[lastFile]}));
        var pre=reason?'<b>Couldn\u2019t send automatically</b> ('+escapeHtml(reason)+'). ':'';
        if(canShare){
          instr.innerHTML=pre+'Tap <b>Share</b> \u2192 <b>Mail</b> \u2192 send to <b>'+EMAIL+'</b> with subject <b>Signature '+escapeHtml(wbLabel)+'</b>';
          shareBtn.style.display='';
        }else{
          instr.innerHTML=pre+'Sharing isn\u2019t available here. <b>Press and hold the image \u2192 Save to Photos</b>, then email it to <b>'+EMAIL+'</b> with subject <b>Signature '+escapeHtml(wbLabel)+'</b>.';
          shareBtn.style.display='none';
        }
        if(canShare&&auto){ doShare(); }
      }
      var configured=SEND_URL&&SEND_URL.indexOf('__')!==0;
      if(!configured||navigator.onLine===false||!window.fetch){
        // Still inside the tap, so the share sheet can open automatically (old behaviour).
        shareFallback(true,configured?'no signal':'');
        return;
      }
      status.textContent='Sending\u2026';
      instr.innerHTML='Sending the signature to Kobi\u2019s Delivery. Please wait.';
      shareBtn.style.display='none';
      sendSignature({key:SEND_KEY,wb:info.wb,customer:info.customer,from:info.from,to:info.to,pieces:info.pieces,weight:info.weight,receivedBy:name,signedAt:time,pngBase64:dataUrl.split(',')[1]})
        .then(function(){
          status.textContent='\u2713 Sent to Kobi\u2019s Delivery';
          instr.innerHTML='All done. You can hand the phone back.';
          shareBtn.style.display='none';
        })
        .catch(function(err){
          // Tap gesture has expired, so iOS won't open the share sheet by itself; show the Share button instead.
          shareFallback(false,(err&&err.message)||'error');
        });
    })();
  };
  function sendSignature(payload){
    var ctrl=window.AbortController?new AbortController():null;
    var t=setTimeout(function(){if(ctrl)ctrl.abort();},SEND_TIMEOUT_MS);
    // text/plain = "simple" request, so no CORS preflight to Apps Script.
    return fetch(SEND_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow',signal:ctrl?ctrl.signal:undefined})
      .then(function(res){if(!res.ok)throw new Error('HTTP '+res.status);return res.json();})
      .then(function(j){clearTimeout(t);if(!j||!j.ok)throw new Error((j&&j.error)||'not sent');return j;},
            function(e){clearTimeout(t);throw (e&&e.name==='AbortError')?new Error('timed out'):(e instanceof TypeError?new Error('no signal'):e);});
  }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
  function doShare(){
    if(!lastFile) return;
    navigator.share({files:[lastFile],title:lastTitle,text:lastText}).catch(function(){});
  }
  document.getElementById('share').onclick=doShare;
  document.getElementById('again').onclick=function(){
    document.getElementById('result').style.display='none';
    document.getElementById('signCard').style.display='block';
    window.scrollTo(0,0);
  };
})();
</script>
</body>
</html>
